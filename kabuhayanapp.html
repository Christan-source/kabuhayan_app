                        </div>
                    ) : (
                        <div className="grid grid-cols-3 gap-6">
                            {enrolled.map(o => { const pct = Math.round(courseCount(progress[o.id], COURSES[o.id]) / courseTotal(COURSES[o.id]) * 100); return (
                                <button key={o.id} onClick={() => setActiveId(o.id)} className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden text-left hover:shadow-md transition">
                                    <img src={o.image} alt="" className="h-32 w-full object-cover" />
                                    <div className="p-4"><p className="font-bold text-gray-900 mb-1 line-clamp-2">{o.title}</p><p className="text-xs text-gray-500 mb-3">{COURSES[o.id].modules.length} modules · {o.provider}</p>
                                        <div className="h-1.5 bg-gray-100 rounded-full overflow-hidden"><div className="h-full bg-brand-blue" style={{ width: pct + '%' }}></div></div>
                                        <p className="text-xs text-gray-500 mt-2">{pct === 100 ? 'Completed' : pct === 0 ? 'Start course' : pct + '% complete'}</p></div>
                                </button>); })}
                        </div>
                    )}
                </div>
            );
        };

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [currentView, setCurrentView] = useState('dashboard');
            const [applications, setApplications] = useState([]);
            const [selectedOpp, setSelectedOpp] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [notifState, setNotifState] = useState({ custom: [], read: [], dismissed: [] });
            const [progress, setProgress] = useState({});
            const [activeCourse, setActiveCourse] = useState(null);
            const [justEnrolled, setJustEnrolled] = useState(false);
            const [avatar, setAvatar] = useState(null);
            useEffect(() => {
                if (!user) { setAvatar(null); return; }
                try { setAvatar(localStorage.getItem(`kc_avatar_${user.id}`) || null); } catch (e) { setAvatar(null); }
            }, [user && user.id]);
            // Returns false if the browser could not store the photo.
            const changeAvatar = (data) => {
                if (!user) return false;
                try {
                    if (data) localStorage.setItem(`kc_avatar_${user.id}`, data);
                    else localStorage.removeItem(`kc_avatar_${user.id}`);
                    setAvatar(data || null);
                    return true;
                } catch (e) { return false; }
            };
            useEffect(() => {
                if (!user) return;
                try { setProgress(JSON.parse(localStorage.getItem(`kc_courses_${user.id}`) || '{}')); } catch (e) {}
            }, [user && user.id]);
            const updateProgress = (oppId, fn) => setProgress(prev => {
                const next = { ...prev, [oppId]: fn(prev[oppId] || {}) };
                if (user) { try { localStorage.setItem(`kc_courses_${user.id}`, JSON.stringify(next)); } catch (e) {} }
                return next;
            });

            useEffect(() => {
                const savedUser = localStorage.getItem('kc_session');
                if (savedUser) setUser(JSON.parse(savedUser));
            }, []);

            useEffect(() => {
                lucide.createIcons();
            });

            // Load this user's saved notification state (read / dismissed / events).
            useEffect(() => {
                if (!user) return;
                let saved = null;
                try { saved = JSON.parse(localStorage.getItem(`kc_notifs_${user.id}`) || 'null'); } catch (e) {}
                setNotifState({
                    custom: (saved && saved.custom) || [],
                    read: (saved && saved.read) || [],
                    dismissed: (saved && saved.dismissed) || []
                });
            }, [user && user.id]);

            const updateNotifs = (fn) => {
                setNotifState(prev => {
                    const next = fn(prev);
                    if (user) {
                        try { localStorage.setItem(`kc_notifs_${user.id}`, JSON.stringify(next)); } catch (e) {}
                    }
                    return next;
                });
            };

            // Switching sections clears the search box; the search results page keeps it.
            const navigate = (view) => {
                setCurrentView(view);
                if (view !== 'search') setSearchQuery('');
            };

            const handleLogin = (userData) => {
                setUser(userData);
                localStorage.setItem('kc_session', JSON.stringify(userData));
            };

            const handleApplySubmit = (opportunity, documents = []) => {
                const newApp = {
                    id: Date.now(),
                    title: opportunity.title,
                    status: 'Under Review',
                    documents,
                    date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
                };
                setApplications([newApp, ...applications]);
                updateNotifs(p => ({
                    ...p,
                    custom: [{
                        id: `app-${newApp.id}`,
                        type: 'application',
                        title: 'Application submitted',
                        body: `${opportunity.title} is now Under Review.` + (documents.length ? ` ${documents.length} document${documents.length > 1 ? 's' : ''} submitted.` : ''),
                        ts: Date.now(),
                        view: 'profile'
                    }, ...p.custom]
                }));
                setSelectedOpp(null);
                if (COURSES[opportunity.id]) {
                    updateProgress(opportunity.id, p => ({ done: [], quiz: {}, ...p }));
                    updateNotifs(p => ({ ...p, custom: [{ id: `course-${opportunity.id}`, type: 'application', title: 'Course unlocked', body: `Your ${opportunity.title} modules are ready.`, ts: Date.now(), view: 'courses' }, ...p.custom] }));
                    setActiveCourse(opportunity.id); setJustEnrolled(true);
                    navigate('courses');
                    return;
                }
                alert(`Successfully applied for: ${opportunity.title}`);
                navigate('profile'); 
            };

            if (!user) return <AuthScreen onLogin={handleLogin} />;

            const notifications = buildNotifications(notifState, applications.map(a => a.title));
            const unreadCount = notifications.filter(n => !n.read).length;

            const handleNotifClick = (n) => {
                updateNotifs(p => p.read.includes(n.id) ? p : { ...p, read: [...p.read, n.id] });
                if (n.oppId) {
                    const opp = mockOpportunities.find(o => o.id === n.oppId);
                    if (opp) setSelectedOpp(opp);
                } else if (n.view) {
                    navigate(n.view);
                }
            };
            const markAllRead = () => updateNotifs(p => ({ ...p, read: Array.from(new Set([...p.read, ...notifications.map(n => n.id)])) }));
            const dismissNotif = (id) => updateNotifs(p => ({ ...p, dismissed: Array.from(new Set([...p.dismissed, id])) }));
            const clearAllNotifs = () => updateNotifs(p => ({ ...p, dismissed: Array.from(new Set([...p.dismissed, ...notifications.map(n => n.id)])) }));

            const renderView = () => {
                switch(currentView) {
                    case 'dashboard': return <DashboardView onApply={setSelectedOpp} user={user} />;
                    case 'opportunities': return <FilteredOpportunitiesView filterType="All" title="All Opportunities" subtitle="Find the best opportunities for your skills and goals." onApply={setSelectedOpp} />;
                    case 'training': return <FilteredOpportunitiesView filterType="Training" title="Training & Seminars" subtitle="Upgrade your skills with these free programs." onApply={setSelectedOpp} />;
                    case 'business': return <FilteredOpportunitiesView filterType="Livelihood" title="Small Business Resources" subtitle="Grants and loans to start or grow your negosyo." onApply={setSelectedOpp} />;
                    case 'financial': return <FilteredOpportunitiesView filterType="Financial Literacy" title="Financial Literacy" subtitle="Learn how to manage your money better." onApply={setSelectedOpp} />;
                    case 'search': return <SearchResultsView query={searchQuery} onApply={setSelectedOpp} />;
                    case 'courses': return <CoursesView progress={progress} updateProgress={updateProgress} user={user} activeId={activeCourse} setActiveId={(id) => { setActiveCourse(id); setJustEnrolled(false); }} welcome={justEnrolled} onBrowse={() => navigate('training')} />;
                    case 'profile': return <ProfileView user={user} applications={applications} avatar={avatar} onAvatarChange={changeAvatar} />;
                    default: return <DashboardView onApply={setSelectedOpp} user={user} />;
                }
            }

            return (
                <div className="min-h-screen bg-brand-light">
                    <Sidebar currentView={currentView} setView={navigate} />
                    <div className="ml-64">
                        <Topbar
                            user={user}
                            query={searchQuery}
                            onQueryChange={setSearchQuery}
                            onSearchSubmit={() => setCurrentView('search')}
                            onSelectOpp={setSelectedOpp}
                            hideSuggestions={currentView === 'search'}
                            notifications={notifications}
                            unreadCount={unreadCount}
                            onNotifClick={handleNotifClick}
                            onMarkAllRead={markAllRead}
                            onClearAll={clearAllNotifs}
                            onDismissNotif={dismissNotif}
                            avatar={avatar}
                        />
                        {renderView()}
                    </div>

                    {selectedOpp && (
                        <OpportunityDetailModal 
                            opportunity={selectedOpp} 
                            onClose={() => setSelectedOpp(null)} 
                            onSubmit={handleApplySubmit} 
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
