        // Crops the picture to a centered square and shrinks it, so it is small enough to save in the browser.
        const resizeImage = (file, size = 320) => new Promise((resolve, reject) => {
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                const s = Math.min(img.width, img.height);
                const c = document.createElement('canvas');
                c.width = c.height = size;
                c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
                URL.revokeObjectURL(url);
                resolve(c.toDataURL('image/jpeg', 0.85));
            };
            img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('unreadable image')); };
            img.src = url;

        const searchOpportunities = (query) => {
            const tokens = query.toLowerCase().split(/\s+/).filter(Boolean);
            if (tokens.length === 0) return [];
            return mockOpportunities
                .map(o => {
                    const title = o.title.toLowerCase();
                    const haystack = [o.title, o.provider, o.location, o.type, o.mode, o.description].join(' ').toLowerCase();
                    return {
                        o,
                        match: tokens.every(t => haystack.includes(t)),
                        titleHits: tokens.filter(t => title.includes(t)).length
                    };
                })
                .filter(r => r.match)
                .sort((a, b) => b.titleHits - a.titleHits)
                .map(r => r.o);
        };

            const tokens = query.trim().split(/\s+/).filter(Boolean)
                .map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
            if (tokens.length === 0) return <>{text}</>;
            const parts = text.split(new RegExp(`(${tokens.join('|')})`, 'gi'));
            return (
                <>
                    {parts.map((p, i) => i % 2 === 1
                        ? <mark key={i} className="bg-yellow-200 text-gray-900 rounded px-0.5">{p}</mark>
                        : <React.Fragment key={i}>{p}</React.Fragment>)}

            if (m < 60) return `${m} min ago`;
            const h = Math.floor(m / 60);
            if (h < 24) return `${h} hr ago`;
            const d = Math.floor(h / 24);
            return `${d} day${d > 1 ? 's' : ''} ago`;
        };

        const NOTIF_STYLES = {
            urgent:      { icon: 'alarm-clock', bg: 'bg-red-100',   text: 'text-red-600' },
            deadline:    { icon: 'clock',       bg: 'bg-amber-100', text: 'text-amber-600' },
            application: { icon: 'file-check',  bg: 'bg-green-100', text: 'text-green-600' },
            info:        { icon: 'sparkles',    bg: 'bg-blue-100',  text: 'text-brand-blue' },
        };

        // Notifications are a mix of:
        //  - "closing soon" reminders, computed from each opportunity's deadline (within 14 days, not yet applied)
        //  - events saved when the user does something (e.g. submits an application)
        //  - a one-time welcome message
        // `state` = { custom: [...], read: [ids], dismissed: [ids] } and is saved per user in localStorage.
        const buildNotifications = (state, appliedTitles) => {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const reminders = [];
            mockOpportunities.forEach(o => {
                if (appliedTitles.includes(o.title)) return;
                const d = new Date(o.deadline);
                if (isNaN(d)) return;
                d.setHours(0, 0, 0, 0);
                const days = Math.round((d - today) / 86400000);
                if (days >= 0 && days <= 14) {
                    reminders.push({
                        id: `deadline-${o.id}`,
                        type: days <= 3 ? 'urgent' : 'deadline',
                        title: days === 0 ? 'Closes today!' : days === 1 ? 'Closes tomorrow!' : `Closes in ${days} days`,
                        body: `${o.title} (${o.provider})`,
                        meta: `Deadline: ${o.deadline}`,
                        oppId: o.id,
                        order: days
                    });
                }
            });
            reminders.sort((a, b) => a.order - b.order);

            const custom = state.custom.map(n => ({ ...n, meta: timeAgo(n.ts) }));

            const welcome = {
                id: 'welcome',
                type: 'info',
                title: 'Welcome to Kabuhayan Connect!',
                body: 'Browse jobs, trainings and livelihood programs, then apply by uploading your documents.',
                meta: 'Getting started',
                view: 'opportunities'
            };

            return [...custom, ...reminders, welcome]
                .filter(n => !state.dismissed.includes(n.id))
                .map(n => ({ ...n, read: state.read.includes(n.id) }));
        };

        // --- AUTHENTICATION COMPONENT ---
        const AuthScreen = ({ onLogin }) => {
            const [isLogin, setIsLogin] = useState(true);
            const [error, setError] = useState('');
            const [isLoading, setIsLoading] = useState(false);

            const [formData, setFormData] = useState({
                name: '', email: '', password: '', confirmPassword: '', phone: '', address: ''
            });

            const handleChange = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.value });
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                setError('');
                setIsLoading(true);

                setTimeout(() => {
                    const existingUsers = JSON.parse(localStorage.getItem('kc_users') || '[]');

                    if (isLogin) {
                        const user = existingUsers.find(u => u.email === formData.email && u.password === formData.password);
                        if (user) {
                            onLogin(user);
                        } else {
                            setError('Invalid email or password. Please try again.');
                            setIsLoading(false);
                        }
                    } else {
                        if (formData.password !== formData.confirmPassword) {
                            setError('Passwords do not match.');
                            setIsLoading(false);
                            return;
                        }
                        if (existingUsers.find(u => u.email === formData.email)) {
                            setError('Email is already registered. Please log in.');
                            setIsLoading(false);
                            return;
                        }

                        const newUser = {
                            id: Date.now().toString(),
                            name: formData.name,
                            email: formData.email,
                            password: formData.password,
                            phone: formData.phone,
                            address: formData.address
                        };

                        existingUsers.push(newUser);
                        localStorage.setItem('kc_users', JSON.stringify(existingUsers));
                        onLogin(newUser);
                    }
                }, 800);
            };

            return (
                <div className="min-h-screen flex bg-white">
                    <div 
                        className="hidden lg:flex w-1/2 flex-col justify-between p-12 relative overflow-hidden bg-cover bg-center"
                        style={{ backgroundColor: '#0B1B36', backgroundImage: "url('https://images.unsplash.com/photo-1522071820081-009f0129c71c?q=80&w=2069&auto=format&fit=crop')" }}
                    >
                        <div className="absolute inset-0 bg-gradient-to-r from-brand-navy/85 via-brand-navy/60 to-brand-navy/30 z-0"></div>
                        <div className="z-10 relative mt-8">
                            <div className="mb-8 inline-block bg-white rounded-xl overflow-hidden shadow-2xl border-4 border-white">
                                <img src="logo.jpg" alt="Kabuhayan Connect Logo" className="w-56 h-auto object-contain" onError={(e) => { e.target.src = 'https://placehold.co/400x400/0056D2/white?text=Kabuhayan+Connect+Logo'; }} />
                            </div>
                            <h1 className="text-4xl font-bold text-white mb-4 drop-shadow-md">Find your next<br/>opportunity today.</h1>
                        </div>
                        <div className="z-10 relative mb-12">
                            <p className="text-2xl text-white font-medium italic drop-shadow-lg">"Kakayahan mo,<br/>Kinabukasan mo!"</p>
                        </div>
                    </div>

                    <div className="w-full lg:w-1/2 flex items-center justify-center p-8 overflow-y-auto max-h-screen">
                        <div className="w-full max-w-md py-8">
                            <h2 className="text-3xl font-bold text-gray-900 mb-2">{isLogin ? 'Welcome Back!' : 'Create an Account'}</h2>
                            <p className="text-gray-500 mb-8">{isLogin ? 'Log in to your Kabuhayan Connect account.' : 'Join us to find opportunities.'}</p>
                            
                            {error && <div className="bg-red-50 text-red-600 p-3 rounded-lg mb-4 text-sm font-medium">{error}</div>}

                            <form onSubmit={handleSubmit} className="space-y-4">
                                {!isLogin && (
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                                        <div className="relative">
                                            <i data-lucide="user" className="absolute left-3 top-3 text-gray-400 w-5 h-5"></i>
                                            <input type="text" name="name" required value={formData.name} onChange={handleChange} className="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-blue outline-none" placeholder="Juan Dela Cruz" />
                                        </div>
                                    </div>
                                )}

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                                    <div className="relative">
                                        <i data-lucide="mail" className="absolute left-3 top-3 text-gray-400 w-5 h-5"></i>
                                        <input type="email" name="email" required value={formData.email} onChange={handleChange} className="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-blue outline-none" placeholder="juan@email.com" />
                                    </div>
                                </div>

                                {!isLogin && (
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                                            <div className="relative">
                                                <i data-lucide="phone" className="absolute left-3 top-3 text-gray-400 w-5 h-5"></i>
                                                <input type="text" name="phone" required value={formData.phone} onChange={handleChange} className="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-blue outline-none" placeholder="+63 912..." />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Address</label>
                                            <div className="relative">
                                                <i data-lucide="map-pin" className="absolute left-3 top-3 text-gray-400 w-5 h-5"></i>
                                                <input type="text" name="address" required value={formData.address} onChange={handleChange} className="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-blue outline-none" placeholder="City, Province" />
                                            </div>
                                        </div>
                                    </div>
                                )}

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                    <div className="relative">
                                        <i data-lucide="lock" className="absolute left-3 top-3 text-gray-400 w-5 h-5"></i>
                                        <input type="password" name="password" required value={formData.password} onChange={handleChange} className="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-blue outline-none" placeholder="••••••••" />
                                    </div>
                                </div>

                                {!isLogin && (
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                                        <div className="relative">
                                            <i data-lucide="shield-check" className="absolute left-3 top-3 text-gray-400 w-5 h-5"></i>
                                            <input type="password" name="confirmPassword" required value={formData.confirmPassword} onChange={handleChange} className="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-blue outline-none" placeholder="••••••••" />
                                        </div>
                                    </div>
                                )}

                                <button type="submit" disabled={isLoading} className="w-full bg-brand-blue text-white py-3 rounded-lg font-bold text-lg hover:bg-blue-700 transition-colors shadow-sm mt-6 disabled:opacity-70">
                                    {isLoading ? 'Processing...' : (isLogin ? 'Log In' : 'Sign Up')}
                                </button>
                            </form>
                            
                            <div className="mt-6 text-center">
                                <p className="text-sm text-gray-500">
                                    {isLogin ? "Don't have an account? " : "Already have an account? "}
                                    <button onClick={() => { setIsLogin(!isLogin); setError(''); }} className="text-brand-blue font-bold hover:underline">
                                        {isLogin ? 'Sign Up' : 'Log In'}
                                    </button>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- SIDEBAR ---
        const Sidebar = ({ currentView, setView }) => {
            const menuItems = [
                { id: 'dashboard', name: 'Dashboard', icon: 'layout-dashboard' },
                { id: 'opportunities', name: 'Opportunities', icon: 'briefcase' },
                { id: 'training', name: 'Training & Seminars', icon: 'book-open' },
                { id: 'courses', name: 'My Courses', icon: 'graduation-cap' },
                { id: 'business', name: 'Small Business Resources', icon: 'store' },
                { id: 'financial', name: 'Financial Literacy', icon: 'wallet' },
                { id: 'profile', name: 'Profile', icon: 'user' },
            ];

            return (
                <div className="w-64 bg-brand-navy text-white flex flex-col h-screen fixed left-0 top-0 overflow-y-auto hide-scrollbar z-20">
                    <div className="p-6 flex justify-center border-b border-white/10">
                        <img src="logo.jpg" alt="Kabuhayan Connect Logo" className="w-full max-w-[160px] h-auto object-contain rounded-lg shadow-sm" onError={(e) => { e.target.src = 'https://placehold.co/200x200/0056D2/white?text=Logo'; }} />
                    </div>
                    
                    <nav className="mt-4 flex-1">
                        {menuItems.map((item) => (
                            <button 
                                key={item.id}
                                onClick={() => setView(item.id)}
                                className={`w-full flex items-center gap-3 px-6 py-3 text-sm font-medium transition-colors ${currentView === item.id ? 'bg-brand-blue border-l-4 border-white' : 'text-gray-300 hover:bg-white/10'}`}
                            >
                                <i data-lucide={item.icon} className="w-5 h-5"></i>
                                {item.name}
                            </button>
                        ))}
                    </nav>

                    <div className="p-4 border-t border-white/10">
                        <button onClick={() => { localStorage.removeItem('kc_session'); window.location.reload(); }} className="flex items-center gap-3 px-4 py-2 text-sm text-red-300 hover:text-white hover:bg-white/10 rounded-lg w-full transition-colors">
                            <i data-lucide="log-out" className="w-5 h-5"></i> Log Out
                        </button>
                    </div>
                </div>
            );
        };

        const Topbar = ({
            user, query, onQueryChange, onSearchSubmit, onSelectOpp, hideSuggestions,
            notifications, unreadCount, onNotifClick, onMarkAllRead, onClearAll, onDismissNotif, avatar
        }) => {
            const [searchOpen, setSearchOpen] = useState(false);
            const [notifOpen, setNotifOpen] = useState(false);
            const [notifTab, setNotifTab] = useState('all');
            const [activeIndex, setActiveIndex] = useState(-1);
            const searchRef = useRef(null);
            const notifRef = useRef(null);
            const inputRef = useRef(null);

            // Topbar re-renders on its own (open/close, typing), so refresh the lucide icons here too.
            useEffect(() => { lucide.createIcons(); });

            // Close dropdowns on outside click / Escape.
            useEffect(() => {
                const onMouseDown = (e) => {
                    if (searchRef.current && !searchRef.current.contains(e.target)) setSearchOpen(false);
                    if (notifRef.current && !notifRef.current.contains(e.target)) setNotifOpen(false);
                };
                const onKeyDown = (e) => {
                    if (e.key === 'Escape') { setSearchOpen(false); setNotifOpen(false); }
                };
                document.addEventListener('mousedown', onMouseDown);
                document.addEventListener('keydown', onKeyDown);
                return () => {
                    document.removeEventListener('mousedown', onMouseDown);
                    document.removeEventListener('keydown', onKeyDown);
                };
            }, []);

            // ---- Search ----
            const trimmed = query.trim();
            const results = trimmed ? searchOpportunities(query) : [];
            const suggestions = results.slice(0, 5);
            const showDropdown = searchOpen && !hideSuggestions;

            const submitSearch = () => {
                if (!trimmed) return;
                setSearchOpen(false);
                if (inputRef.current) inputRef.current.blur();
                onSearchSubmit();
            };

            const pickResult = (opp) => {
                setSearchOpen(false);
                if (inputRef.current) inputRef.current.blur();
                onSelectOpp(opp);
            };

            const handleSearchKeyDown = (e) => {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    setActiveIndex(i => Math.min(i + 1, suggestions.length - 1));
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    setActiveIndex(i => Math.max(i - 1, -1));
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (activeIndex >= 0 && suggestions[activeIndex]) pickResult(suggestions[activeIndex]);
                    else submitSearch();
                }
            };

            const runQuickSearch = (term) => {
                onQueryChange(term);
                setSearchOpen(false);
                onSearchSubmit();
            };

            // ---- Notifications ----
            const visibleNotifs = notifTab === 'unread' ? notifications.filter(n => !n.read) : notifications;

            return (
                <div className="h-20 bg-white border-b flex items-center justify-between px-8 fixed top-0 right-0 left-64 z-10">
                    {/* Search */}
                    <div ref={searchRef} className="relative w-96">
                        <div className="flex items-center bg-gray-100 rounded-full px-4 py-2 focus-within:ring-2 focus-within:ring-brand-blue/40">
                            <Icon name="search" className="text-gray-400 w-5 h-5 mr-2" />
                            <input
                                ref={inputRef}
                                type="text"
                                value={query}
                                onChange={(e) => { onQueryChange(e.target.value); setActiveIndex(-1); setSearchOpen(true); setNotifOpen(false); }}
                                onFocus={() => { setSearchOpen(true); setNotifOpen(false); }}
                                onKeyDown={handleSearchKeyDown}
                                placeholder="Search opportunities..."
                                aria-label="Search opportunities"
                                className="bg-transparent border-none outline-none text-sm w-full"
                            />
                            {query && (
                                <button
                                    type="button"
                                    onClick={() => { onQueryChange(''); setActiveIndex(-1); if (inputRef.current) inputRef.current.focus(); }}
                                    aria-label="Clear search"
                                    className="text-gray-400 hover:text-gray-700 ml-2"
                                >
                                    <Icon name="x" className="w-4 h-4" />
                                </button>
                            )}
                        </div>

                        {showDropdown && (
                            <div className="absolute left-0 top-full mt-2 w-[32rem] max-w-[calc(100vw-20rem)] bg-white rounded-xl shadow-xl border border-gray-100 overflow-hidden z-30">
                                {!trimmed ? (
                                    <div className="p-4">
                                        <p className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">Popular searches</p>
                                        <div className="flex flex-wrap gap-2">
                                            {QUICK_SEARCHES.map(term => (
                                                <button
                                                    key={term}
                                                    type="button"
                                                    onClick={() => runQuickSearch(term)}
                                                    className="text-sm bg-gray-100 hover:bg-blue-50 hover:text-brand-blue text-gray-700 px-3 py-1.5 rounded-full transition-colors"
                                                >
                                                    {term}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                ) : results.length === 0 ? (
                                    <div className="p-6 text-center">
                                        <Icon name="search-x" className="w-8 h-8 text-gray-300 mx-auto mb-2" />
                                        <p className="text-sm font-semibold text-gray-800">No results for "{trimmed}"</p>
                                        <p className="text-xs text-gray-500 mt-1">Try a job title, a provider like TESDA, or a place like Lipa.</p>
                                    </div>
                                ) : (
                                    <>
                                        <div className="max-h-96 overflow-y-auto chat-scroll">
                                            {suggestions.map((opp, idx) => (
                                                <button
                                                    key={opp.id}
                                                    type="button"
                                                    onMouseEnter={() => setActiveIndex(idx)}
                                                    onClick={() => pickResult(opp)}
                                                    className={`w-full flex items-center gap-3 px-4 py-3 text-left transition-colors ${idx === activeIndex ? 'bg-blue-50' : 'hover:bg-gray-50'}`}
                                                >
                                                    <img src={opp.image} alt="" className="w-11 h-11 rounded-lg object-cover shrink-0 bg-gray-100" />
                                                    <div className="min-w-0 flex-1">
                                                        <p className="text-sm font-semibold text-gray-900 truncate"><Highlight text={opp.title} query={query} /></p>
                                                        <p className="text-xs text-gray-500 truncate"><Highlight text={`${opp.provider} \u00B7 ${opp.location}`} query={query} /></p>
                                                    </div>
                                                    <span className="text-[10px] bg-gray-100 text-gray-600 px-2 py-1 rounded-full shrink-0">{opp.type}</span>
                                                </button>
                                            ))}
                                        </div>
                                        <button
                                            type="button"
                                            onClick={submitSearch}
                                            className="w-full flex items-center justify-between px-4 py-3 text-sm font-semibold text-brand-blue bg-gray-50 border-t hover:bg-blue-50 transition-colors"
                                        >
                                            <span>See all {results.length} result{results.length > 1 ? 's' : ''} for "{trimmed}"</span>
                                            <Icon name="arrow-right" className="w-4 h-4" />
                                        </button>
                                    </>
                                )}
                            </div>
                        )}
                    </div>

                    <div className="flex items-center gap-6">
                        {/* Notification bell */}
                        <div ref={notifRef} className="relative">
                            <button
                                type="button"
                                onClick={() => { setNotifOpen(o => !o); setSearchOpen(false); }}
                                aria-label={`Notifications${unreadCount ? `, ${unreadCount} unread` : ''}`}
                                aria-expanded={notifOpen}
                                className={`relative p-2 rounded-full transition-colors ${notifOpen ? 'bg-blue-50 text-brand-blue' : 'text-gray-500 hover:text-gray-800 hover:bg-gray-100'}`}
                            >
                                <Icon name="bell" className="w-6 h-6" />
                                {unreadCount > 0 && (
                                    <span className="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 bg-red-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-white">
                                        {unreadCount > 9 ? '9+' : unreadCount}
                                    </span>
                                )}
                            </button>

                            {notifOpen && (
                                <div className="absolute right-0 top-full mt-3 w-[26rem] bg-white rounded-xl shadow-xl border border-gray-100 overflow-hidden z-30">
                                    <div className="px-4 pt-4 pb-3 border-b">
                                        <div className="flex items-center justify-between mb-3">
                                            <h3 className="font-bold text-gray-900">Notifications</h3>
                                            {unreadCount > 0 && (
                                                <span className="text-xs font-semibold bg-red-50 text-red-600 px-2 py-0.5 rounded-full">{unreadCount} new</span>
                                            )}
                                        </div>
                                        <div className="flex gap-2">
                                            {['all', 'unread'].map(tab => (
                                                <button
                                                    key={tab}
                                                    type="button"
                                                    onClick={() => setNotifTab(tab)}
                                                    className={`text-xs font-semibold px-3 py-1.5 rounded-full capitalize transition-colors ${notifTab === tab ? 'bg-brand-blue text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}
                                                >
                                                    {tab}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="max-h-96 overflow-y-auto chat-scroll">
                                        {visibleNotifs.length === 0 ? (
                                            <div className="p-8 text-center">
                                                <Icon name="bell-off" className="w-10 h-10 text-gray-300 mx-auto mb-3" />
                                                <p className="text-sm font-semibold text-gray-800">
                                                    {notifTab === 'unread' ? "You're all caught up" : 'No notifications'}
                                                </p>
                                                <p className="text-xs text-gray-500 mt-1">
                                                    {notifTab === 'unread' ? 'No unread notifications right now.' : 'Deadline reminders and application updates will show up here.'}
                                                </p>
                                            </div>
                                        ) : (
                                            visibleNotifs.map(n => {
                                                const style = NOTIF_STYLES[n.type] || NOTIF_STYLES.info;
                                                return (
                                                    <div
                                                        key={n.id}
                                                        className={`group relative flex items-start gap-3 px-4 py-3 border-b border-gray-50 cursor-pointer transition-colors ${n.read ? 'hover:bg-gray-50' : 'bg-blue-50/60 hover:bg-blue-50'}`}
                                                        onClick={() => { setNotifOpen(false); onNotifClick(n); }}
                                                    >
                                                        <div className={`w-9 h-9 rounded-full flex items-center justify-center shrink-0 ${style.bg} ${style.text}`}>
                                                            <Icon name={style.icon} className="w-4 h-4" />
                                                        </div>
                                                        <div className="min-w-0 flex-1 pr-5">
                                                            <p className={`text-sm text-gray-900 ${n.read ? 'font-medium' : 'font-bold'}`}>{n.title}</p>
                                                            <p className="text-xs text-gray-600 mt-0.5 line-clamp-2">{n.body}</p>
                                                            <p className="text-[11px] text-gray-400 mt-1">{n.meta}</p>
                                                        </div>
                                                        {!n.read && <span className="w-2 h-2 bg-brand-blue rounded-full mt-2 shrink-0"></span>}
                                                        <button
                                                            type="button"
                                                            onClick={(e) => { e.stopPropagation(); onDismissNotif(n.id); }}
                                                            aria-label="Dismiss notification"
                                                            className="absolute top-2 right-2 p-1 rounded-full text-gray-300 hover:text-gray-600 hover:bg-gray-100 opacity-0 group-hover:opacity-100 transition-opacity"
                                                        >
                                                            <Icon name="x" className="w-3.5 h-3.5" />
                                                        </button>
                                                    </div>
                                                );
                                            })
                                        )}
                                    </div>

                                    {notifications.length > 0 && (
                                        <div className="flex items-center justify-between px-4 py-3 bg-gray-50 border-t">
                                            <button
                                                type="button"
                                                onClick={onMarkAllRead}
                                                disabled={unreadCount === 0}
                                                className="text-xs font-semibold text-brand-blue hover:underline disabled:text-gray-400 disabled:no-underline disabled:cursor-default flex items-center gap-1"
                                            >
                                                <Icon name="check-check" className="w-4 h-4" /> Mark all as read
                                            </button>
                                            <button
                                                type="button"
                                                onClick={onClearAll}
                                                className="text-xs font-semibold text-gray-500 hover:text-red-600 flex items-center gap-1"
                                            >
                                                <Icon name="trash-2" className="w-4 h-4" /> Clear all
                                            </button>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        <div className="flex items-center gap-3">
                            <Avatar src={avatar} name={user.name} className="w-10 h-10" />
                            <div className="text-sm">
                                <p className="font-semibold text-gray-800">{user.name}</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- UPLOAD REQUIREMENT MODAL ---
        const MAX_FILE_SIZE = 5 * 1024 * 1024; // 5MB
        const DEFAULT_FILE_TYPES = ['pdf', 'doc', 'docx', 'jpg', 'jpeg', 'png'];

        const formatFileSize = (bytes) => {
            if (bytes < 1024) return `${bytes} B`;
            if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} KB`;
            return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
        };

        // One upload slot per required document. Falls back to a single slot built from `requirement`.
        const getDocuments = (opp) => Array.isArray(opp.documents)
            ? opp.documents
            : [{ id: 'document', label: 'Required document', hint: opp.requirement, required: true }];

        const OpportunityDetailModal = ({ opportunity, onClose, onSubmit }) => {
            const [step, setStep] = useState(1);
            const [files, setFiles] = useState({});        // { [docId]: { name, size } }
            const [errors, setErrors] = useState({});      // { [docId]: 'message' }
            const [dragOver, setDragOver] = useState(null);
            const [agreed, setAgreed] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const scrollRef = useRef(null);

            const documents = getDocuments(opportunity);
            const requiredDocs = documents.filter(d => d.required);
            const uploadedRequired = requiredDocs.filter(d => files[d.id]).length;
            const noDocsNeeded = documents.length === 0;
            const canSubmit = uploadedRequired === requiredDocs.length && agreed && !isSubmitting;

            // The modal re-renders on its own (steps, uploads), so refresh the lucide icons here.
            useEffect(() => { lucide.createIcons(); });
            useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = 0; }, [step]);

            const handleFile = (doc, file) => {
                if (!file) return;
                const allowed = doc.accept || DEFAULT_FILE_TYPES;
                const ext = file.name.includes('.') ? file.name.split('.').pop().toLowerCase() : '';
                let message = '';
                if (!allowed.includes(ext)) {
                    message = `That file type isn't accepted. Please upload a ${allowed.map(a => a.toUpperCase()).join(', ')} file.`;
                } else if (file.size > MAX_FILE_SIZE) {
                    message = `That file is ${formatFileSize(file.size)}. The maximum size is 5MB.`;
                }
                if (message) {
                    setErrors(prev => ({ ...prev, [doc.id]: message }));
                    return;
                }
                setErrors(prev => { const next = { ...prev }; delete next[doc.id]; return next; });
                setFiles(prev => ({ ...prev, [doc.id]: { name: file.name, size: file.size } }));
            };

            const onPick = (doc, e) => {
                handleFile(doc, e.target.files && e.target.files[0]);
                e.target.value = ''; // lets the same file be picked again after removing it
            };

            const removeFile = (docId) => {
                setFiles(prev => { const next = { ...prev }; delete next[docId]; return next; });
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!canSubmit) return;
                setIsSubmitting(true);
                const submitted = documents.filter(d => files[d.id]).map(d => ({ label: d.label, name: files[d.id].name }));
                setTimeout(() => {
                    onSubmit(opportunity, submitted);
                    setIsSubmitting(false);
                }, 1000);
            };

            const stepPill = (n, label) => (
                <span className={`px-2.5 py-1 rounded-full ${step === n ? 'bg-white text-brand-blue' : 'bg-white/20 text-white'}`}>{n}. {label}</span>
            );

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center modal-backdrop p-4">
                    <div className="bg-white rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">

                        {/* Header */}
                        <div className="bg-brand-blue p-6 text-white relative shrink-0">
                            <button onClick={onClose} aria-label="Close" className="absolute top-4 right-4 text-white/80 hover:text-white"><Icon name="x" className="w-6 h-6" /></button>
                            <span className="text-xs font-bold uppercase tracking-wider bg-blue-700/50 px-2 py-1 rounded-md mb-2 inline-block">
                                {opportunity.type}
                            </span>
                            <h3 className="text-2xl font-bold mb-1 leading-tight pr-8">{opportunity.title}</h3>
                            <p className="text-blue-100 flex items-center gap-2"><Icon name="building" className="w-4 h-4" /> {opportunity.provider}</p>
                            <div className="flex items-center gap-2 mt-4 text-xs font-semibold">
                                {stepPill(1, 'Overview')}
                                <Icon name="chevron-right" className="w-3 h-3 text-white/60" />
                                {stepPill(2, 'Apply')}
                            </div>
                        </div>

                        {/* Scrollable Content Area */}
                        <div ref={scrollRef} className="p-6 overflow-y-auto flex-1 chat-scroll">

                            {step === 1 && (
                                <div className="space-y-6">
                                    <img src={opportunity.image} alt={opportunity.title} className="w-full h-48 object-cover rounded-xl" />

                                    <div className="grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded-xl border border-gray-100">
                                        <div className="flex items-center gap-3">
                                            <div className="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center shrink-0"><Icon name="map-pin" className="w-4 h-4" /></div>
                                            <div>
                                                <p className="text-xs text-gray-500">Location</p>
                                                <p className="text-sm font-semibold text-gray-900">{opportunity.location}</p>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            <div className="w-8 h-8 rounded-full bg-red-100 text-red-600 flex items-center justify-center shrink-0"><Icon name="calendar" className="w-4 h-4" /></div>
                                            <div>
                                                <p className="text-xs text-gray-500">Deadline</p>
                                                <p className="text-sm font-semibold text-gray-900">{opportunity.deadline}</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <h4 className="text-lg font-bold text-gray-900 mb-2">About This Program</h4>
                                        <p className="text-sm text-gray-600 leading-relaxed">{opportunity.description}</p>
                                    </div>

                                    <div className="bg-yellow-50 border border-yellow-200 p-5 rounded-xl">
                                        <h4 className="text-md font-bold text-yellow-800 mb-3 flex items-center gap-2">
                                            <Icon name="clipboard-list" className="w-5 h-5" /> Requirements
                                        </h4>
                                        <ul className="space-y-2">
                                            {opportunity.requirementDetails.map((req, index) => (
                                                <li key={index} className="text-sm text-yellow-800 flex items-start gap-2">
                                                    <Icon name="check" className="w-4 h-4 mt-0.5" />
                                                    <span>{req}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                </div>
                            )}

                            {step === 2 && (
                                <div className="space-y-8">
                                    <div className="bg-blue-50 border border-blue-100 p-4 rounded-lg">
                                        <p className="text-sm text-blue-800 font-medium">
                                            You are applying for: <br /> <span className="font-bold">{opportunity.title}</span>
                                        </p>
                                    </div>

                                    {/* ---- More details ---- */}
                                    <section>
                                        <h4 className="text-lg font-bold text-gray-900 mb-3 flex items-center gap-2">
                                            <Icon name="info" className="w-5 h-5 text-brand-blue" /> More Details
                                        </h4>

                                        {opportunity.details && opportunity.details.length > 0 && (
                                            <div className="grid grid-cols-2 gap-3">
                                                {opportunity.details.map((d, i) => (
                                                    <div key={i} className="flex items-start gap-3 bg-gray-50 border border-gray-100 rounded-xl p-3">
                                                        <div className="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center shrink-0">
                                                            <Icon name={d.icon} className="w-4 h-4" />
                                                        </div>
                                                        <div className="min-w-0">
                                                            <p className="text-xs text-gray-500">{d.label}</p>
                                                            <p className="text-sm font-semibold text-gray-900">{d.value}</p>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        {opportunity.highlights && opportunity.highlights.length > 0 && (
                                            <div className="mt-4 bg-green-50 border border-green-100 rounded-xl p-5">
                                                <h5 className="text-sm font-bold text-green-800 mb-3">{opportunity.highlightsTitle || 'Highlights'}</h5>
                                                <ul className="space-y-2">
                                                    {opportunity.highlights.map((h, i) => (
                                                        <li key={i} className="text-sm text-green-900 flex items-start gap-2">
                                                            <Icon name="check" className="w-4 h-4 mt-0.5 text-green-600" />
                                                            <span>{h}</span>
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>
                                        )}

                                        {opportunity.process && opportunity.process.length > 0 && (
                                            <div className="mt-4">
                                                <h5 className="text-sm font-bold text-gray-900 mb-3">How the application works</h5>
                                                <ol className="space-y-3">
                                                    {opportunity.process.map((p, i) => (
                                                        <li key={i} className="flex items-start gap-3">
                                                            <span className="w-6 h-6 rounded-full bg-brand-blue text-white text-xs font-bold flex items-center justify-center shrink-0">{i + 1}</span>
                                                            <span className="text-sm text-gray-700 pt-0.5">{p}</span>
                                                        </li>
                                                    ))}
                                                </ol>
                                            </div>
                                        )}
                                    </section>

                                    {/* ---- Upload requirements ---- */}
                                    <section>
                                        <div className="flex items-center justify-between mb-2">
                                            <h4 className="text-lg font-bold text-gray-900 flex items-center gap-2">
                                                <Icon name="upload" className="w-5 h-5 text-brand-blue" /> {noDocsNeeded ? 'Confirm Attendance' : 'Upload Your Requirements'}
                                            </h4>
                                            {requiredDocs.length > 0 && (
                                                <span className="text-xs font-semibold text-gray-500">{uploadedRequired} of {requiredDocs.length} required</span>
                                            )}
                                        </div>

                                        {requiredDocs.length > 0 && (
                                            <div className="h-1.5 bg-gray-100 rounded-full mb-4 overflow-hidden">
                                                <div className="h-full bg-brand-blue transition-all" style={{ width: `${(uploadedRequired / requiredDocs.length) * 100}%` }}></div>
                                            </div>
                                        )}

                                        {noDocsNeeded && (
                                            <div className="bg-green-50 border border-green-200 rounded-xl p-4 text-sm text-green-800">
                                                {opportunity.requirement}
                                            </div>
                                        )}

                                        <div className="space-y-4">
                                            {documents.map(doc => {
                                                const file = files[doc.id];
                                                const err = errors[doc.id];
                                                const types = doc.accept || DEFAULT_FILE_TYPES;
                                                const acceptAttr = types.map(t => '.' + t).join(',');
                                                return (
                                                    <div key={doc.id} className={`rounded-xl border p-4 transition-colors ${file ? 'border-green-300 bg-green-50/50' : err ? 'border-red-300 bg-red-50/40' : 'border-gray-200 bg-white'}`}>
                                                        <div className="flex items-start justify-between gap-3 mb-3">
                                                            <div>
                                                                <p className="text-sm font-semibold text-gray-900">
                                                                    {doc.label} {doc.required
                                                                        ? <span className="text-red-500">*</span>
                                                                        : <span className="text-xs font-normal text-gray-400">(optional)</span>}
                                                                </p>
                                                                {doc.hint && <p className="text-xs text-gray-500 mt-0.5">{doc.hint}</p>}
                                                            </div>
                                                            {file && <span className="text-[10px] font-bold uppercase bg-green-100 text-green-700 px-2 py-1 rounded-full shrink-0">Uploaded</span>}
                                                        </div>

                                                        {file ? (
                                                            <div className="flex items-center gap-3 bg-white border border-green-200 rounded-lg px-3 py-2.5">
                                                                <Icon name="file-check" className="w-5 h-5 text-green-600" />
                                                                <div className="min-w-0 flex-1">
                                                                    <p className="text-sm font-medium text-gray-800 truncate">{file.name}</p>
                                                                    <p className="text-xs text-gray-400">{formatFileSize(file.size)}</p>
                                                                </div>
                                                                <label className="text-xs font-semibold text-brand-blue hover:underline cursor-pointer">
                                                                    Replace
                                                                    <input type="file" className="hidden" accept={acceptAttr} onChange={(e) => onPick(doc, e)} />
                                                                </label>
                                                                <button type="button" onClick={() => removeFile(doc.id)} aria-label={`Remove ${doc.label}`} className="text-gray-400 hover:text-red-500">
                                                                    <Icon name="trash-2" className="w-4 h-4" />
                                                                </button>
                                                            </div>
                                                        ) : (
                                                            <label
                                                                onDragOver={(e) => { e.preventDefault(); setDragOver(doc.id); }}
                                                                onDragLeave={() => setDragOver(null)}
                                                                onDrop={(e) => { e.preventDefault(); setDragOver(null); handleFile(doc, e.dataTransfer.files && e.dataTransfer.files[0]); }}
                                                                className={`block border-2 border-dashed rounded-lg p-5 text-center cursor-pointer transition-colors ${dragOver === doc.id ? 'border-brand-blue bg-blue-50' : 'border-gray-300 hover:bg-gray-50'}`}
                                                            >
                                                                <input type="file" className="hidden" accept={acceptAttr} onChange={(e) => onPick(doc, e)} />
                                                                <Icon name="upload" className="w-7 h-7 mx-auto mb-2 text-gray-400" />
                                                                <p className="text-sm font-medium text-gray-600">Click to browse or drag and drop</p>
                                                                <p className="text-xs text-gray-400 mt-1">{types.map(t => t.toUpperCase()).join(', ')} · Max 5MB</p>
                                                            </label>
                                                        )}

                                                        {err && (
                                                            <p className="text-xs text-red-600 mt-2 flex items-start gap-1.5">
                                                                <Icon name="info" className="w-3.5 h-3.5 mt-0.5" /> <span>{err}</span>
                                                            </p>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        <label className="flex items-start gap-3 bg-gray-50 border border-gray-200 rounded-xl p-4 cursor-pointer mt-5">
                                            <input type="checkbox" checked={agreed} onChange={(e) => setAgreed(e.target.checked)} className="mt-0.5 w-4 h-4 accent-brand-blue" />
                                            <span className="text-sm text-gray-700">
                                                {noDocsNeeded
                                                    ? 'I confirm that I will attend and bring a valid ID on the day of the event.'
                                                    : 'I confirm that the documents I am submitting are true and correct.'}
                                            </span>
                                        </label>
                                    </section>
                                </div>
                            )}
                        </div>

                        {/* Footer Actions */}
                        <div className="p-6 border-t bg-gray-50 flex gap-3 items-center justify-between shrink-0">
                            {step === 1 ? (
                                <>
                                    <button type="button" onClick={onClose} className="px-5 py-2.5 rounded-lg font-medium text-gray-600 hover:bg-gray-200 transition-colors">Close</button>
                                    <button type="button" onClick={() => setStep(2)} className="px-6 py-2.5 rounded-lg font-bold text-white bg-brand-blue hover:bg-blue-700 transition-colors flex items-center gap-2">
                                        Proceed to Apply <Icon name="arrow-right" className="w-4 h-4" />
                                    </button>
                                </>
                            ) : (
                                <>
                                    <button type="button" onClick={() => setStep(1)} className="px-5 py-2.5 rounded-lg font-medium text-gray-600 hover:bg-gray-200 transition-colors flex items-center gap-2">
                                        <Icon name="arrow-left" className="w-4 h-4" /> Back
                                    </button>
                                    <div className="flex items-center gap-4">
                                        {!canSubmit && !isSubmitting && (
                                            <p className="text-xs text-gray-500 text-right">
                                                {uploadedRequired < requiredDocs.length
                                                    ? `Upload all required documents (${uploadedRequired}/${requiredDocs.length})`
                                                    : 'Tick the confirmation box to continue'}
                                            </p>
                                        )}
                                        <button onClick={handleSubmit} disabled={!canSubmit} className="px-6 py-2.5 rounded-lg font-bold text-white bg-brand-blue hover:bg-blue-700 transition-colors flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap">
                                            {isSubmitting ? 'Submitting...' : 'Submit Application'}
                                        </button>
                                    </div>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const DashboardView = ({ onApply, user }) => {
            const firstName = user.name.split(' ')[0]; 
            return (
                <div className="p-8 max-w-7xl mx-auto pt-28">
                    <div className="mb-8">
                        <h2 className="text-2xl font-bold text-gray-900">Good morning, {firstName}!</h2>
                        <p className="text-gray-500">Here are some opportunities and resources just for you.</p>
                    </div>

                    <div className="bg-blue-600 rounded-2xl p-8 text-white flex justify-between items-center mb-8 relative overflow-hidden">
                        <div className="z-10 max-w-lg">
                            <h3 className="text-3xl font-bold mb-4">Build your skills.<br/>Find opportunities.<br/>Create a better tomorrow.</h3>
                            <button className="bg-brand-yellow text-gray-900 font-bold py-2 px-6 rounded-lg hover:bg-yellow-500 transition-colors">Explore Opportunities</button>
                        </div>
                    </div>

                    <div className="grid grid-cols-4 gap-6 mb-10">
                        {[
                            { label: 'Job Opportunities', count: 3, icon: 'briefcase', color: 'text-blue-500', bg: 'bg-blue-50' },
                            { label: 'Livelihood Programs', count: 2, icon: 'store', color: 'text-green-500', bg: 'bg-green-50' },
                            { label: 'Training & Seminars', count: 3, icon: 'book-open', color: 'text-purple-500', bg: 'bg-purple-50' },
                            { label: 'Financial Literacy', count: 2, icon: 'wallet', color: 'text-yellow-500', bg: 'bg-yellow-50' },
                        ].map((stat, i) => (
                            <div key={i} className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4">
                                <div className={`w-12 h-12 rounded-full flex items-center justify-center ${stat.bg} ${stat.color}`}>
                                    <i data-lucide={stat.icon} className="w-6 h-6"></i>
                                </div>
                                <div>
                                    <p className="text-sm text-gray-500">{stat.label}</p>
                                    <p className="text-2xl font-bold text-gray-900">{stat.count}</p>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="flex justify-between items-center mb-4">
                        <h3 className="text-lg font-bold text-gray-900">Featured Opportunities</h3>
                    </div>
                    <div className="grid grid-cols-4 gap-6">
                        {mockOpportunities.slice(0, 4).map(opp => (
                            <OpportunityCard key={opp.id} opp={opp} onApply={onApply} />
                        ))}
                    </div>
                </div>
            );
        };

        const OpportunityCard = ({ opp, onApply }) => (
            <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-shadow flex flex-col">
                <img src={opp.image} alt={opp.title} className="w-full h-32 object-cover" />
                <div className="p-4 flex-1 flex flex-col">
                    <h4 className="font-bold text-sm text-gray-900 mb-1 line-clamp-2">{opp.title}</h4>
                    <p className="text-xs text-gray-500 mb-2 flex items-center gap-1"><i data-lucide="building" className="w-3 h-3"></i> {opp.provider}</p>
                    <p className="text-xs text-gray-500 mb-4 flex items-center gap-1"><i data-lucide="map-pin" className="w-3 h-3"></i> {opp.location}</p>
                    <div className="mt-auto flex gap-2 mb-3">
                        <span className="text-[10px] bg-gray-100 text-gray-600 px-2 py-1 rounded-full">{opp.type}</span>
                        <span className="text-[10px] bg-green-50 text-green-600 px-2 py-1 rounded-full">{opp.mode}</span>
                    </div>
                    <button onClick={() => onApply(opp)} className="w-full bg-brand-blue text-white text-sm py-2 rounded-lg font-medium hover:bg-blue-700">Apply Now</button>
                </div>
            </div>
        );

        const FilteredOpportunitiesView = ({ filterType, title, subtitle, onApply }) => {
            const filtered = mockOpportunities.filter(o => o.type === filterType || filterType === 'All');
            
            return (
                <div className="p-8 max-w-7xl mx-auto pt-28">
                    <div className="mb-8">
                        <h2 className="text-2xl font-bold text-gray-900">{title}</h2>
                        <p className="text-gray-500">{subtitle}</p>
                    </div>
                    {filtered.length === 0 ? (
                        <div className="bg-white p-12 rounded-xl text-center border border-gray-100">
                            <i data-lucide="inbox" className="w-12 h-12 text-gray-300 mx-auto mb-3"></i>
                            <h3 className="text-lg font-bold text-gray-800">No items found</h3>
                            <p className="text-gray-500">Check back later for updates.</p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-3 gap-6">
                            {filtered.map(opp => <OpportunityCard key={opp.id} opp={opp} onApply={onApply} />)}
                        </div>
                    )}
                </div>
            );
        };

        const SearchResultsView = ({ query, onApply }) => {
            const [typeFilter, setTypeFilter] = useState('All');
            useEffect(() => { lucide.createIcons(); });

            const trimmed = query.trim();
            const matches = trimmed ? searchOpportunities(query) : mockOpportunities;
            const types = ['All', ...Array.from(new Set(matches.map(o => o.type)))];
            const activeFilter = types.includes(typeFilter) ? typeFilter : 'All';
            const shown = activeFilter === 'All' ? matches : matches.filter(o => o.type === activeFilter);

            return (
                <div className="p-8 max-w-7xl mx-auto pt-28">
                    <div className="mb-6">
                        <h2 className="text-2xl font-bold text-gray-900">
                            {trimmed ? <>Search results for "{trimmed}"</> : 'All Opportunities'}
                        </h2>
                        <p className="text-gray-500">
                            {trimmed
                                ? `${matches.length} result${matches.length === 1 ? '' : 's'} found`
                                : 'Type in the search bar to narrow things down.'}
                        </p>
                    </div>

                    {matches.length > 0 && (
                        <div className="flex flex-wrap gap-2 mb-6">
                            {types.map(t => (
                                <button
                                    key={t}
                                    type="button"
                                    onClick={() => setTypeFilter(t)}
                                    className={`text-sm font-medium px-4 py-1.5 rounded-full border transition-colors ${activeFilter === t ? 'bg-brand-blue text-white border-brand-blue' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}`}
                                >
                                    {t}
                                </button>
                            ))}
                        </div>
                    )}

                    {shown.length === 0 ? (
                        <div className="bg-white p-12 rounded-xl text-center border border-gray-100">
                            <Icon name="search-x" className="w-12 h-12 text-gray-300 mx-auto mb-3" />
                            <h3 className="text-lg font-bold text-gray-800">No opportunities found</h3>
                            <p className="text-gray-500">Try a different keyword, like a job title, provider (TESDA, DTI) or location.</p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-3 gap-6">
                            {shown.map(opp => <OpportunityCard key={opp.id} opp={opp} onApply={onApply} />)}
                        </div>
                    )}
                </div>
            );
        };

        const ProfileView = ({ user, applications, avatar, onAvatarChange }) => {
            const fileRef = useRef(null);
            const [photoError, setPhotoError] = useState('');
            const [busy, setBusy] = useState(false);
            const choose = () => { if (fileRef.current) fileRef.current.click(); };
            const onPick = async (e) => {

        };
        const courseTotal = (c) => c.modules.reduce((n, m) => n + m.lessons.length + 1, 0);
        // Progress saved against an older version of a course is ignored, so renumbered lessons never show as wrongly "done".
        const courseCount = (pr, c) => (!pr || (c && c.v && pr.v !== c.v)) ? 0 : (pr.done || []).length + Object.keys(pr.quiz || {}).length;
        const qsOf = (m) => Array.isArray(m.quiz) ? m.quiz : [m.quiz];

            const done = fresh ? (prog.done || []) : [], quiz = fresh ? (prog.quiz || {}) : {};
            const items = [];
            course.modules.forEach((m, mi) => { m.lessons.forEach((_, li) => items.push({ m: mi, l: li })); items.push({ m: mi, quiz: true }); });
            const isDone = (it) => it.quiz ? !!quiz[it.m] : done.includes(`${it.m}-${it.l}`);
            const unlocked = (it) => !it.quiz || course.modules[it.m].lessons.every((_, li) => done.includes(`${it.m}-${li}`));
            const [sel, setSel] = useState(() => items.find(i => !isDone(i)) || items[0]);
            const [picks, setPicks] = useState({});
            useEffect(() => { lucide.createIcons(); });
            useEffect(() => { if (!fresh) update(() => ({ done: [], quiz: {}, v: course.v })); }, []);
            const pct = Math.round(courseCount(prog, course) / courseTotal(course) * 100);
            const idx = items.findIndex(i => i.m === sel.m && i.l === sel.l && !!i.quiz === !!sel.quiz);
            const goNext = () => { const n = items[idx + 1]; if (n) { setSel(n); setPicks({}); } };
            const open = (it) => { if (unlocked(it)) { setSel(it); setPicks({}); } };
            const mod = course.modules[sel.m];
            const lesson = !sel.quiz && mod.lessons[sel.l];
            const qs = lesson ? [] : qsOf(mod);
            const nCorrect = qs.filter((q, k) => picks[k] === q.a).length;
            const passed = !lesson && (!!quiz[sel.m] || nCorrect === qs.length);
            const completeLesson = () => { update(p => ({ ...p, v: course.v, done: Array.from(new Set([...(p.done || []), `${sel.m}-${sel.l}`])) })); goNext(); };
            const answer = (qi, i) => {
                const np = { ...picks, [qi]: i };
                setPicks(np);

                        {course.subtitle && <p className="text-sm text-gray-500 mb-3">{course.subtitle}</p>}

                        {course.about && (
                            <details className="mt-4">
                                <summary className="cursor-pointer text-sm font-semibold text-brand-blue">About this course &amp; learning tips</summary>

                                    <p className="text-xs font-bold text-gray-400 uppercase">Module {mi + 1}</p>
                                    <p className="font-bold text-gray-900 mb-2">{m.title}</p>
                                    {items.filter(i => i.m === mi).map((it, k) => {
                                        const active = sel.m === it.m && sel.l === it.l && !!sel.quiz === !!it.quiz;
                                        const ok = isDone(it), lock = !unlocked(it);
                                        return (
                                            <button key={k} onClick={() => open(it)} disabled={lock} className={`w-full text-left flex items-center gap-2 px-3 py-2 rounded-lg text-sm ${active ? 'bg-blue-50 text-brand-blue font-semibold' : 'text-gray-700 hover:bg-gray-50'} disabled:opacity-40`}>
                                                <Icon name={ok ? 'check-circle' : lock ? 'lock' : it.quiz ? 'help-circle' : 'play-circle'} className={`w-4 h-4 shrink-0 ${ok ? 'text-green-600' : ''}`} />
                                                <span className="truncate">{it.quiz ? 'Module Quiz' : m.lessons[it.l].title}</span>
                                            </button>

                                    })}

                                    <div className="mt-4 mb-6"><Blocks items={lesson.text} /></div>
                                    <button onClick={completeLesson} className="px-6 py-2.5 rounded-lg font-bold text-white bg-brand-blue hover:bg-blue-700">{done.includes(`${sel.m}-${sel.l}`) ? 'Continue' : 'Mark as Complete & Continue'}</button>
                                </>
                            ) : (
                                <>
                                    <h3 className="text-xl font-bold text-gray-900 mb-2">Module Quiz</h3>

                                                ))}

                                        </div>
                                    ))}
